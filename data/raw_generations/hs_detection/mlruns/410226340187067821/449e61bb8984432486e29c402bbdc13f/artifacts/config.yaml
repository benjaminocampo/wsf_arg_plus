input:
  skip_hate_data: true
  data_path: ../data/wsf_arg_extension_with_nohs_cw.csv
  data_size: 1
  run_name: llama-8B-small_detect_hs_with_cw_noarg
  uri_path: ./mlruns
llm:
  slurm_params:
    partition: gpu_h100
    time: 00-00:40:00
    gres: gpu:h100:1
    mem: 40G
  name: llama-8B-small
  params:
    model: meta-llama/Llama-3.1-8B-Instruct
    max_tokens: 4096
    max_model_len: 32768
    max_num_batched_tokens: 32768
    dtype: auto
    tensor_parallel_size: 1
experiment:
  experiment_name: detect_hs_with_cw_noarg
  experiment_description: We are labeling the entire HS
  use_checkworthiness: true
  system: 'You are an expert model for detecting hate speech in text messages based
    on the following definition of hate speech:

    Hate speech is considered any kind of content that conveys malevolent intentions
    toward a group or an individual, and motivated by inherent characteristics that
    are attributed to that group and shared among its members such as race, color,
    ethnicity, gender, sexual orientation, nationality, religion, disability, social
    status, health conditions, or other characteristics.

    '
  user: "Components in the message are labeled with its check-worthiness information\
    \ based on these categories:\n  - Non-Factual: Subjective text such as opinions,\
    \ beliefs, declarations, or wishes. Many questions also fall into this category.\
    \ These sentences do not contain any factual claim.  \n  - Unimportant Factual:\
    \ Text that contain factual claims but are not important for fact-checking. The\
    \ general public would not be interested in verifying them.  \n  - Check-worthy\
    \ Factual: Text that contain factual claims of public interest. These are the\
    \ kinds of claims journalists would fact-check.\nGiven this message and its check-worthiness\
    \ labels. Classify if it is either hateful or not.\n\nInput:\n{input_text}\n"
  output_labels:
  - hateful
  - non-hateful

