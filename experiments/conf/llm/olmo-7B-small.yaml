slurm_params:
  partition: gpu_h100
  time: 00-00:10:00
  gres: gpu:h100:1
  mem: 20G

name: olmo-7B-small
params:
  model: allenai/OLMo-2-1124-7B-Instruct
  max_tokens: 4096
  max_model_len: 16384
  max_num_batched_tokens: 16384
  dtype: auto   # vllm internally often runs with fp16 however xgrammar is not updated to support fp16.
  tensor_parallel_size: 1