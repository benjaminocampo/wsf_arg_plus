defaults:
  - _self_
  - llm: mistral-7B-small
  - prompt: zero-shot

input:
  data_path: ../data/wsf_annotations_misinformation.csv
  data_size: 0.1                   # This parameter is just for testing. Should be equal to 1
  run_name: mistral-7B-small       # Run name will be the same as the llm name
  uri_path: ./mlruns              # Results will be saved in the ./mlruns using mlflow
  experiment_name: pred_hate_taxonomies
  experiment_description: "We are labeling for implicit hate speech taxonomies using LLMs"